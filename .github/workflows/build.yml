name: 🚀 Build INCO CODE APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Node.js 18 ────────────────────────────────────
      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── 4. Installer les dépendances ─────────────────────
      - name: 📦 Install dependencies
        run: npm install

      # ── 5. Cache Gradle ──────────────────────────────────
      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 6. Android SDK ───────────────────────────────────
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 7. Accepter les licences SDK ─────────────────────
      - name: ✅ Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── 8. Télécharger gradle-wrapper.jar ────────────────
      - name: 📥 Download gradle-wrapper.jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/refs/tags/v8.3.0/gradle/wrapper/gradle-wrapper.jar"

      # ── 9. Créer le dossier assets ───────────────────────
      - name: 📁 Create assets folder
        run: mkdir -p android/app/src/main/assets

      # ── 10. Bundle React Native JS ───────────────────────
      - name: ⚡ Bundle JS
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # ── 11. Permissions gradlew ──────────────────────────
      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      # ── 12. Build APK Debug ──────────────────────────────
      - name: 🔨 Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_TOOL_OPTIONS: ""
          JDK_JAVA_OPTIONS: ""

      # ── 13. Renommer l'APK ───────────────────────────────
      - name: ✏️ Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/INCO-CODE-v1.0.0.apk

      # ── 14. Upload Artifact ──────────────────────────────
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INCO-CODE-APK
          path: android/app/build/outputs/apk/debug/INCO-CODE-v1.0.0.apk
          retention-days: 30

      # ── 15. Résumé final ─────────────────────────────────
      - name: ✅ Summary
        run: |
          echo "## ✅ INCO CODE — Build réussi!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 App | INCO CODE |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷 Version | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Type | Debug APK |" >> $GITHUB_STEP_SUMMARY
          echo "| ☕ Java | 17 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Node | 18 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **APK disponible dans Artifacts ci-dessus**" >> $GITHUB_STEP_SUMMARY
