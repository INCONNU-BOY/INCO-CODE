name: 🚀 Build INCO CODE APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Verify RN Gradle plugin
        run: |
          if [ ! -d "node_modules/@react-native/gradle-plugin" ]; then
            echo "❌ node_modules/@react-native/gradle-plugin introuvable!"
            exit 1
          fi
          echo "✅ Plugin OK"

      - name: 📥 Setup gradle-wrapper.jar
        run: |
          mkdir -p android/gradle/wrapper
          WRAPPER_JAR=$(find node_modules -name "gradle-wrapper.jar" 2>/dev/null | head -1)
          if [ -n "$WRAPPER_JAR" ]; then
            cp "$WRAPPER_JAR" android/gradle/wrapper/gradle-wrapper.jar
            echo "✅ Copied from: $WRAPPER_JAR"
          else
            echo "⚠️ Not found in node_modules, downloading..."
            curl -fsSL -o /tmp/gradle-8.3-bin.zip \
              "https://services.gradle.org/distributions/gradle-8.3-bin.zip"
            WRAPPER_PATH=$(unzip -l /tmp/gradle-8.3-bin.zip | grep -i "wrapper.*jar" | awk '{print $4}' | head -1)
            unzip -j /tmp/gradle-8.3-bin.zip "$WRAPPER_PATH" -d android/gradle/wrapper/
            mv android/gradle/wrapper/$(basename "$WRAPPER_PATH") android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ✅ Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: 📁 Create assets folder
        run: mkdir -p android/app/src/main/assets

      - name: ⚡ Bundle JS
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_TOOL_OPTIONS: ""
          JDK_JAVA_OPTIONS: ""

      - name: ✏️ Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/INCO-CODE-v1.0.0.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INCO-CODE-APK
          path: android/app/build/outputs/apk/debug/INCO-CODE-v1.0.0.apk
          retention-days: 30

      - name: ✅ Summary
        run: |
          echo "## ✅ INCO CODE — Build réussi!" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 App | INCO CODE |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷 Version | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Type | Debug APK |" >> $GITHUB_STEP_SUMMARY
          echo "| ☕ Java | 17 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Node | 18 |" >> $GITHUB_STEP_SUMMARY
